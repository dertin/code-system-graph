# Supply-chain cooldown policy for registry dependency updates.
# Use `cargo cooldown update` instead of `cargo update`.
# See https://github.com/dertin/cargo-cooldown

[cooldown]
incompatible-publish-age = "deny"
lockfile-baseline = "floor"

[registry]
global-min-publish-age = "14 days"

# TLS, SSL, and cryptography crates may need security patches sooner.
# Allow rules only reduce the effective cooldown; they never increase it.
[[allow.package]]
crate = "aws-lc-rs"
min-publish-age = "2 days"

[[allow.package]]
crate = "aws-lc-sys"
min-publish-age = "2 days"

[[allow.package]]
crate = "getrandom"
min-publish-age = "2 days"

[[allow.package]]
crate = "hyper-rustls"
min-publish-age = "2 days"

[[allow.package]]
crate = "native-tls"
min-publish-age = "2 days"

[[allow.package]]
crate = "openssl"
min-publish-age = "2 days"

[[allow.package]]
crate = "openssl-probe"
