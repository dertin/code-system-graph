[package]
name = "code-system-graph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "CLI, MCP, and HTTP delivery for local multi-repository code intelligence."
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["development-tools", "command-line-utilities"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/code-system-graph-{ target }-v{ version }{ archive-suffix }"
bin-dir = "code-system-graph-{ target }-v{ version }/bin/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install", "compile"]

[package.metadata.binstall.overrides.'cfg(windows)']
pkg-fmt = "zip"

[[bin]]
name = "csgraph"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
atomic-write-file = "0.3.1"
axum = "0.8.9"
blake3 = "1.8.7"
foldhash = "0.2.0"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
code-system-graph-core = { version = "1.2.0", path = "../code-system-graph-core" }
code-system-graph-hooks = { version = "1.2.0", path = "../code-system-graph-hooks" }
code-system-graph-model = { version = "1.2.0", path = "../code-system-graph-model" }
code-system-graph-store-sqlite = { version = "1.2.0", path = "../code-system-graph-store-sqlite" }
rmcp = { version = "3.5.0", features = ["transport-io"] }
notify = "8.2.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = "0.4.4"
subtle = "2.6.1"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tower = { version = "0.5.3", features = ["util", "limit"] }
tower-http = { version = "0.7.1", features = ["catch-panic", "limit", "sensitive-headers", "set-header", "timeout"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["fs", "signal"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[lints]
workspace = true

[dev-dependencies]
jsonschema = { version = "0.58.5", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde-saphyr = "1.3.0"
tempfile = "3.27.0"
