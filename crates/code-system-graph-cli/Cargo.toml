[package]
name = "code-system-graph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/code-system-graph-{ target }-v{ version }{ archive-suffix }"
bin-dir = "code-system-graph-{ target }-v{ version }/bin/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install", "compile"]

[package.metadata.binstall.overrides.'cfg(windows)']
pkg-fmt = "zip"

[[bin]]
name = "csgraph"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
atomic-write-file = "0.3.0"
axum = "0.8.9"
clap = { version = "4.6.4", features = ["derive"] }
clap_complete = "4.6.8"
code-system-graph-core = { version = "1.0.0", path = "../code-system-graph-core" }
code-system-graph-hooks = { version = "1.0.0", path = "../code-system-graph-hooks" }
code-system-graph-model = { version = "1.0.0", path = "../code-system-graph-model" }
code-system-graph-store-sqlite = { version = "1.0.0", path = "../code-system-graph-store-sqlite" }
rmcp = { version = "3.1.0", features = ["transport-io"] }
notify = "8.2.0"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
subtle = "2.6.1"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tower = { version = "0.5.3", features = ["util", "limit"] }
tower-http = { version = "0.7.0", features = ["catch-panic", "limit", "sensitive-headers", "set-header", "timeout"] }

[lints]
workspace = true

[dev-dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
rusqlite = "0.40.1"
tempfile = "3.27.0"
