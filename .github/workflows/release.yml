name: Release
run-name: Release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target
  PRODUCT_NAME: code-system-graph
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Install stable Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install stable
          rustup default stable

      - name: Verify tag matches workspace version
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "Release tag must look like vX.Y.Z; got ${RELEASE_TAG}" >&2
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          head_commit="$(git rev-parse HEAD)"
          if [ "$tag_commit" != "$head_commit" ]; then
            echo "Checked-out commit ${head_commit} does not match tag ${RELEASE_TAG} (${tag_commit})" >&2
            exit 1
          fi
          publishable_crates_json='["code-system-graph-model","code-system-graph-hooks","code-system-graph-store-sqlite","code-system-graph-core","code-system-graph"]'
          manifest_version="$(
            cargo metadata --locked --no-deps --format-version 1 |
              jq -er --argjson publishable "$publishable_crates_json" \
                '[.packages[] | select(.name as $n | $publishable | index($n)) | .version] | unique | if length == 1 then .[0] else error("publishable crate versions differ") end'
          )"
          tag_version="${RELEASE_TAG#v}"
          if [ "$manifest_version" != "$tag_version" ]; then
            echo "Tag v${tag_version} does not match workspace version ${manifest_version}" >&2
            exit 1
          fi

      - name: Run tests
        env:
          CARGO_TERM_COLOR: never
        run: cargo test --workspace --exclude code-system-graph-fuzz --all-targets --all-features --locked

  release-policy:
    name: Release policy
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check dependency policy
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Audit dependencies
        run: cargo audit --deny warnings

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # Automatic read-only job token; never replace with a PAT.
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-2025

    env:
      TARGET: ${{ matrix.target }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Install stable Rust toolchain
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install stable
          rustup default stable
          rustup target add "$TARGET"

      - name: Build release binaries
        run: cargo build --locked --release --target ${{ matrix.target }} --bin csgraph --bin code-system-graph-hooks

      - name: Run target tests
        if: runner.os == 'Linux'
        run: cargo test --workspace --exclude code-system-graph-fuzz --all-features --locked --target ${{ matrix.target }}

      - name: Run target tests serially
        if: runner.os != 'Linux'
        run: cargo test --workspace --exclude code-system-graph-fuzz --all-features --locked --target ${{ matrix.target }} -- --test-threads=1

      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          asset_dir="${PRODUCT_NAME}-${TARGET}-v${version}"
          doc_dir="dist/${asset_dir}/share/doc/${PRODUCT_NAME}"
          mkdir -p "dist/${asset_dir}/bin" "$doc_dir"
          cp "target/${TARGET}/release/csgraph" "dist/${asset_dir}/bin/"
          cp "target/${TARGET}/release/code-system-graph-hooks" "dist/${asset_dir}/bin/"
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md README.md SECURITY.md "$doc_dir/"
          cp -R docs "$doc_dir/"
          cp scripts/install.sh scripts/uninstall.sh "dist/${asset_dir}/"
          tar -C dist -czf "dist/${asset_dir}.tgz" "${asset_dir}"
          rm -rf "dist/${asset_dir}"

      - name: Smoke-test Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          asset_dir="${PRODUCT_NAME}-${TARGET}-v${version}"
          extracted="$(mktemp -d)"
          trap 'rm -rf "$extracted"' EXIT
          tar -C "$extracted" -xzf "dist/${asset_dir}.tgz"
          scripts/smoke-install.sh "$extracted/${asset_dir}"

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $assetDir = "$env:PRODUCT_NAME-$env:TARGET-v$version"
          $binDir = "dist\$assetDir\bin"
          $docDir = "dist\$assetDir\share\doc\$env:PRODUCT_NAME"
          New-Item -ItemType Directory -Path $binDir, $docDir -Force
          Copy-Item "target\$env:TARGET\release\csgraph.exe" $binDir
          Copy-Item "target\$env:TARGET\release\code-system-graph-hooks.exe" $binDir
          Copy-Item LICENSE, NOTICE, THIRD_PARTY_NOTICES.md, README.md, SECURITY.md $docDir
          Copy-Item docs "$docDir\docs" -Recurse
          Compress-Archive -Path "dist\$assetDir" -DestinationPath "dist\$assetDir.zip" -Force
          Remove-Item "dist\$assetDir" -Recurse -Force

      - name: Smoke-test Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $assetDir = "$env:PRODUCT_NAME-$env:TARGET-v$version"
          $extracted = Join-Path $env:RUNNER_TEMP "code-system-graph-release-smoke"
          Expand-Archive -Path "dist\$assetDir.zip" -DestinationPath $extracted -Force
          $binDir = Join-Path $extracted "$assetDir\bin"
          $actualVersion = & (Join-Path $binDir "csgraph.exe") --version
          if ($actualVersion -ne "csgraph $version") {
            throw "unexpected csgraph version: $actualVersion"
          }
          if (-not (Test-Path (Join-Path $binDir "code-system-graph-hooks.exe"))) {
            throw "code-system-graph-hooks.exe is missing from the archive"
          }

      - name: Upload release asset
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  sbom:
    name: Generate SBOM
    needs: validate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate CycloneDX SBOM
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p dist
          syft dir:. \
            --exclude './target/**' \
            --exclude './dist/**' \
            --source-name "Code System Graph" \
            --source-version "$version" \
            -o "cyclonedx-json=dist/${PRODUCT_NAME}-v${version}.cdx.json"

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [build, release-policy, sbom]
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum * > SHA256SUMS

      - name: Generate artifact attestations
        uses: actions/attest@v4
        with:
          subject-path: release-assets/*

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* --verify-tag --generate-notes
          fi
