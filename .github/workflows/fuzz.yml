name: Fuzz

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
          fallback: cargo-install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-cooldown
          fallback: cargo-install
      - uses: Swatinem/rust-cache@v2
      - name: Enforce dependency cooldown policy
        run: scripts/validate-lockfile-cooldown.sh fuzz/Cargo.toml
      - run: cargo check --manifest-path fuzz/Cargo.toml --locked
      - run: cargo fuzz run parsers --target x86_64-unknown-linux-gnu -- -max_total_time=120 -max_len=2097152
        working-directory: fuzz
      - run: cargo fuzz run interfaces --target x86_64-unknown-linux-gnu -- -max_total_time=120 -max_len=2097152
        working-directory: fuzz
